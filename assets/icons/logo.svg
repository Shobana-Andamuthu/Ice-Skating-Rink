<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" class="frostiva-logo-svg" dir="ltr">
  <defs>
    <linearGradient id="frostIceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FA9D8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDF4FF" />
    </linearGradient>
    <filter id="frostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4FA9D8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Geometric Snowflake / Ice Blade Mark -->
  <g transform="translate(6, 4)" filter="url(#frostGlow)">
    <!-- Hexagonal crystal core -->
    <polygon points="24,4 40,14 40,34 24,44 8,34 8,14" stroke="url(#frostIceGrad)" stroke-width="2.5" fill="rgba(79, 169, 216, 0.08)"/>
    <!-- Central Snowflake Star -->
    <line x1="24" y1="8" x2="24" y2="40" stroke="url(#frostIceGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="38" y2="32" stroke="url(#frostIceGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="38" y2="16" stroke="url(#frostIceGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade Arc -->
    <path d="M4 38 Q24 48 44 38 L42 41 Q24 51 6 41 Z" fill="url(#bladeGrad)" stroke="#4FA9D8" stroke-width="0.8"/>
    <!-- Coral Sparkle dot -->
    <circle cx="24" cy="24" r="3.5" fill="#FF6B5A" />
    <!-- Diamond accents -->
    <polygon points="24,10 26,13 24,16 22,13" fill="#DDF4FF"/>
    <polygon points="24,32 26,35 24,38 22,35" fill="#DDF4FF"/>
  </g>
  <!-- Brand Name Typography -->
  <text x="62" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" class="brand-text-title" fill="currentColor" text-anchor="start" direction="ltr">
    FROST<tspan fill="#4FA9D8">IVA</tspan>
  </text>
  <!-- Tagline -->
  <text x="63" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#64748B" class="brand-text-sub" text-anchor="start" direction="ltr">
    SKATE • GLIDE • CELEBRATE
  </text>
</svg>
