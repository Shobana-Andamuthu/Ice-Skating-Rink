<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — Frostiva</title>
  <meta name="description" content="Access your Frostiva skater dashboard, manage pass memberships, view upcoming ice sessions and booking history.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body">

  <!-- ==================== PAGE PRELOADER ==================== -->
  <div class="page-preloader" id="pagePreloader" aria-hidden="true">
    <div class="preloader-content">
      <div class="preloader-spinner-wrap">
        <svg class="preloader-snowflake-svg" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="22" stroke="rgba(79, 169, 216, 0.2)" stroke-width="3"/>
          <circle cx="25" cy="25" r="22" stroke="url(#iceLoaderGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="60" class="spinner-ring"/>
          <defs>
            <linearGradient id="iceLoaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4FA9D8"/>
              <stop offset="100%" stop-color="#FF6B5A"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="preloader-icon-center">
          <i class="fas fa-snowflake"></i>
        </div>
      </div>
      <div class="preloader-brand">
        FROST<span>IVA</span>
      </div>
      <div class="preloader-bar">
        <div class="preloader-bar-fill"></div>
      </div>
    </div>
  </div>

  <main>
    <div class="auth-split-wrapper">
      <!-- Left Visual Side -->
      <div class="auth-visual-side" style="background-image: url('assets/images/hero-login.jpg');">
        <a href="index.html" class="auth-brand-logo" aria-label="Frostiva Home">
          <svg class="frostiva-logo-svg" dir="ltr" viewBox="0 0 240 56" fill="none" style="height: 42px; width: auto;">
            <g transform="translate(6, 4)">
              <polygon points="24,4 40,14 40,34 24,44 8,34 8,14" stroke="#4FA9D8" stroke-width="2.5" fill="rgba(79, 169, 216, 0.1)"/>
              <line x1="24" y1="8" x2="24" y2="40" stroke="#4FA9D8" stroke-width="2" stroke-linecap="round"/>
              <line x1="10" y1="16" x2="38" y2="32" stroke="#4FA9D8" stroke-width="2" stroke-linecap="round"/>
              <line x1="10" y1="32" x2="38" y2="16" stroke="#4FA9D8" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 38 Q24 48 44 38 L42 41 Q24 51 6 41 Z" fill="#DDF4FF" stroke="#4FA9D8" stroke-width="0.8"/>
              <circle cx="24" cy="24" r="3.5" fill="#FF6B5A" />
            </g>
            <text x="62" y="32" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" class="brand-text-title" fill="#FFFFFF" text-anchor="start" direction="ltr">
              FROST<tspan fill="#4FA9D8">IVA</tspan>
            </text>
            <text x="63" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="start" direction="ltr">
              SKATE CLUB
            </text>
          </svg>
        </a>

        <div class="auth-visual-content">
          <span class="section-eyebrow" style="background: rgba(79, 169, 216, 0.25); color: #DDF4FF; border: 1px solid rgba(79, 169, 216, 0.4);">
            <i class="fas fa-snowflake"></i> Skater Member Portal
          </span>
          <h1 class="auth-visual-title">Welcome Back to the Ice</h1>
          <p class="auth-visual-text">
            Log in to manage your session bookings, track your skate passes, review coaching schedules, and access fast-track turnstile codes.
          </p>
        </div>
      </div>

      <!-- Right Form Side -->
      <div class="auth-form-side">
        <div class="auth-top-nav">
          <a href="index.html" class="auth-back-home"><i class="fas fa-arrow-left"></i> Back to Site</a>
          <div class="auth-toggles">
            <button class="icon-btn theme-toggle-btn" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
            <button class="icon-btn rtl-toggle-btn" aria-label="Toggle RTL"><span>RTL</span></button>
          </div>
        </div>

        <div class="auth-box">
          <!-- Auth Tabs -->
          <div class="auth-tabs">
            <button class="auth-tab-btn active" id="loginTabBtn">Sign In</button>
            <button class="auth-tab-btn" id="registerTabBtn">Create Account</button>
          </div>

          <!-- Login Form -->
          <form id="loginForm" action="dashboard.html" method="GET">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <div class="input-wrap">
                <input type="email" id="loginEmail" class="form-control" placeholder="skater@example.com" value="skater@frostiva.com" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="input-wrap">
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" value="••••••••" required>
                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-row-remember">
              <label class="checkbox-label">
                <input type="checkbox" checked>
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
              <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
            </button>
          </form>

          <!-- Register Form -->
          <form id="registerForm" action="dashboard.html" method="GET" style="display: none;">
            <div class="form-group">
              <label class="form-label" for="regName">Full Name</label>
              <div class="input-wrap">
                <input type="text" id="regName" class="form-control" placeholder="e.g. Alex Morgan" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regEmail">Email Address</label>
              <div class="input-wrap">
                <input type="email" id="regEmail" class="form-control" placeholder="alex@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regPhone">Phone Number</label>
              <div class="input-wrap">
                <input type="tel" id="regPhone" class="form-control" placeholder="(555) 000-0000" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regPass">Create Password</label>
              <div class="input-wrap">
                <input type="password" id="regPass" class="form-control" placeholder="At least 8 characters" required>
                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regPassConfirm">Confirm Password</label>
              <div class="input-wrap">
                <input type="password" id="regPassConfirm" class="form-control" placeholder="Confirm password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-coral" style="width: 100%;">
              <i class="fas fa-user-plus"></i> Create Skater Account
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
